        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script async defer data-domain="lse.de" src="https://plausible.io/js/plausible.js"></script>

execute:
  freeze: auto
